<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generátor adresy na obálku</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b94a0c'/%3E%3Crect x='10' y='16' width='44' height='32' rx='4' fill='%23fff'/%3E%3Cpath d='M12 20l20 15 20-15' fill='none' stroke='%23b94a0c' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; background: #f0f2f5; color: #1a1a1a; }
.app { display: grid; grid-template-columns: 400px 1fr; min-height: 100vh; }

/* ---- Formulářový panel ---- */
.form-panel { background:#d5b7a6; color: #fff; padding: 24px 22px 20px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
.form-panel h2 { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #432b14; margin-bottom: 8px; }
.page-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #fff; background: #5c2306; padding: 6px 10px; border-radius: 4px; margin: 20px 0 12px; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #5c2306; }
.field input[type=text], .field select { width: 100%; background: #fff; color: #1a1a1a; border: 1px solid #ffb27a; border-radius: 4px; font-size: 12px; font-family: inherit; padding: 7px 10px; outline: none; }
.field input:focus, .field select:focus { border-color: #ffd9b3; box-shadow: 0 0 0 2px rgba(255,217,179,.5); }
.field input[type=range] { width: 100%; accent-color: #fff; }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.file-field { border: 1px dashed #ffd9b3; border-radius: 4px; padding: 8px 10px; font-size: 11px; color: #fff; cursor: pointer; text-align: center; background: rgba(255,255,255,.12); }
.file-field:hover { background: rgba(255,255,255,.22); border-color: #fff; }
.link { font-size: 11px; color: #ffe0b2; cursor: pointer; background: none; border: none; text-decoration: underline; margin-top: 4px; font-family: inherit; }
.btn-row { display: flex; flex-direction: column; gap: 8px; margin: 20px 0 0; position: sticky; bottom: 0; background:#d5b7a6; padding: 8px 0; }
.btn { padding: 10px 16px; border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
.btn-primary { background: #432b14; color:#d5b7a6; } .btn-primary:hover { background: #ffe9d6; }
.btn-secondary { background: transparent; color: #fff; border: 1px solid #ffd9b3; } .btn-secondary:hover { background: rgba(255,255,255,.15); }

/* ---- Náhled A4 ---- */
.preview-panel { padding: 30px 10px 60px; display: flex; justify-content: center; overflow: auto; }
.page { background: #fff; width: 210mm; height: 297mm; flex: none; position: relative; box-shadow: 0 4px 32px rgba(0,0,0,.18); overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif; color: #000; padding: 15mm; display: flex; flex-direction: column; align-items: flex-start; gap: 8mm; }
.block { width: 90mm; padding: 3mm; }
body.frame .block { outline: .3mm dashed #999; }
.block h3 { font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2.5mm; }
.block .row { display: flex; align-items: center; gap: 4mm; }
.block .logo { flex: none; }
.block .logo img { display: block; max-width: 100%; height: auto; }
.block .addr { flex: 1; min-width: 0; font-size: 11pt; line-height: 1.3; text-transform: uppercase; }
.block .addr .name { font-weight: 700; }
.block .addr div { min-height: 1.3em; }

@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; }
  .app { display: block !important; }
  .form-panel { display: none !important; }
  .preview-panel { display: block !important; padding: 0 !important; }
  .page { box-shadow: none !important; margin: 0 !important; }
  @page { size: A4; margin: 0; }
}
</style>
</head>
<body>
<div class="app">
  <div class="form-panel">
    <h2>Adresa na obálku</h2>

    <div class="page-label">Odesílatel</div>
    <div class="field"><label>Logo odesílatele</label>
      <select id="sLogoSel">
        <option value="default">Atomicon – kruhové logo (výchozí)</option>
        <option value="gisadmin">Atomicon – logo z GISAdmin (logo3.png)</option>
        <option value="none">Bez loga</option>
        <option value="custom">Vlastní soubor…</option>
      </select>
      <div class="file-field" style="margin-top:6px" onclick="document.getElementById('sLogoFile').click()">+ Nahrát vlastní logo</div>
      <input type="file" id="sLogoFile" accept="image/*" style="display:none">
    </div>
    <div class="field"><label>Velikost loga: <span id="sLogoVal"></span> mm</label><input type="range" id="sLogoSize" min="10" max="40" step="1" value="22"></div>
    <div class="field"><label>Název</label><input type="text" id="sName" spellcheck="false"></div>
    <div class="field"><label>Ulice a č. p.</label><input type="text" id="sStreet" spellcheck="false"></div>
    <div class="row2">
      <div class="field"><label>Obec</label><input type="text" id="sCity" spellcheck="false"></div>
      <div class="field"><label>PSČ</label><input type="text" id="sZip" spellcheck="false"></div>
    </div>

    <div class="page-label">Adresát</div>
    <div class="field"><label>Logo obce</label>
      <div class="file-field" onclick="document.getElementById('rLogoFile').click()" id="rLogoBtn">+ Vybrat obrázek loga obce</div>
      <input type="file" id="rLogoFile" accept="image/*" style="display:none">
      <button type="button" class="link" id="rLogoClear" style="display:none">Odebrat logo</button>
    </div>
    <div class="field"><label>Velikost loga: <span id="rLogoVal"></span> mm</label><input type="range" id="rLogoSize" min="10" max="40" step="1" value="22"></div>
    <div class="field"><label>Název (např. Obec Olší)</label><input type="text" id="rName" spellcheck="false"></div>
    <div class="field"><label>Doplňující řádek (např. k rukám starosty)</label><input type="text" id="rExtra" spellcheck="false"></div>
    <div class="field"><label>Ulice a č. p.</label><input type="text" id="rStreet" spellcheck="false"></div>
    <div class="row2">
      <div class="field"><label>Obec</label><input type="text" id="rCity" spellcheck="false"></div>
      <div class="field"><label>PSČ</label><input type="text" id="rZip" spellcheck="false"></div>
    </div>

    <div class="field" style="margin-top:14px"><label style="display:flex;gap:6px;align-items:center;font-size:12px"><input type="checkbox" id="frame"> Rámeček kolem bloků (pomůcka pro vystřižení)</label></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="window.print()">⬇ Tisk / uložit jako PDF (Ctrl+P)</button>
      <button class="btn btn-secondary" id="bReset">Vymazat adresáta</button>
    </div>
  </div>

  <div class="preview-panel">
    <div class="page" id="page">
      <div class="block" id="sender">
        <h3>Odesílatel:</h3>
        <div class="row"><div class="logo" id="pSLogo"></div><div class="addr" id="pS"></div></div>
      </div>
      <div class="block" id="recipient">
        <h3>Adresát:</h3>
        <div class="row"><div class="logo" id="pRLogo"></div><div class="addr" id="pR"></div></div>
      </div>
    </div>
  </div>
</div>

const LOGO_GISADMIN = 'https://gisadmin.atomicon.cz/static/images/logo3.png';
const SENDER_DEFAULT = {sName:'Atomicon s.r.o.', sStreet:'Stupkova 952/18', sCity:'Olomouc', sZip:'77900'};
const $ = id => document.getElementById(id);
let customSLogo = null, rLogo = null;

function fmtZip(z){ const d = (z||'').replace(/\s+/g,''); return /^\d{5}$/.test(d) ? d.slice(0,3)+' '+d.slice(3) : (z||'').trim(); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function addrHtml(name, extra, street, city, zip){
  const lines = [];
  if (name.trim())   lines.push('<div class="name">'+esc(name.trim())+'</div>');
  if (extra.trim())  lines.push('<div>'+esc(extra.trim())+'</div>');
  if (street.trim()) lines.push('<div>'+esc(street.trim())+'</div>');
  const cz = [fmtZip(zip), city.trim()].filter(Boolean).join(' ');
  if (cz)            lines.push('<div>'+esc(cz)+'</div>');
  return lines.join('');
}
function logoHtml(src, mm){ return src ? '<img src="'+src+'" alt="" style="width:'+mm+'mm">' : ''; }

function render(){
  $('pS').innerHTML = addrHtml($('sName').value, '', $('sStreet').value, $('sCity').value, $('sZip').value);
  $('pR').innerHTML = addrHtml($('rName').value, $('rExtra').value, $('rStreet').value, $('rCity').value, $('rZip').value);
  const sel = $('sLogoSel').value;
  const sSrc = sel==='default' ? LOGO_DEFAULT : sel==='gisadmin' ? LOGO_GISADMIN : sel==='custom' ? customSLogo : null;
  $('sLogoVal').textContent = $('sLogoSize').value; $('rLogoVal').textContent = $('rLogoSize').value;
  $('pSLogo').innerHTML = logoHtml(sSrc, $('sLogoSize').value);
  $('pRLogo').innerHTML = logoHtml(rLogo, $('rLogoSize').value);
  $('rLogoClear').style.display = rLogo ? 'inline' : 'none';
  $('rLogoBtn').textContent = rLogo ? '✓ Logo obce nahráno – nahrát jiné' : '+ Vybrat obrázek loga obce';
  saveSender();
}
function readImg(file, cb){ if(!file) return; const r = new FileReader(); r.onload = e => cb(e.target.result); r.readAsDataURL(file); }

function saveSender(){ try { localStorage.setItem('obalkaSender', JSON.stringify({
  sName:$('sName').value, sStreet:$('sStreet').value, sCity:$('sCity').value, sZip:$('sZip').value,
  sLogoSel:$('sLogoSel').value==='custom' ? 'default' : $('sLogoSel').value, sLogoSize:$('sLogoSize').value, rLogoSize:$('rLogoSize').value })); } catch(e){} }
function loadSender(){
  let s = {}; try { s = JSON.parse(localStorage.getItem('obalkaSender')) || {}; } catch(e){}
  const v = Object.assign({}, SENDER_DEFAULT, s);
  ['sName','sStreet','sCity','sZip'].forEach(k => $(k).value = v[k]);
  if (v.sLogoSel) $('sLogoSel').value = v.sLogoSel;
  if (v.sLogoSize) $('sLogoSize').value = v.sLogoSize;
  if (v.rLogoSize) $('rLogoSize').value = v.rLogoSize;
}

['sName','sStreet','sCity','sZip','rName','rExtra','rStreet','rCity','rZip','sLogoSel','sLogoSize','rLogoSize']
  .forEach(id => $(id).addEventListener('input', render));
$('sLogoFile').onchange = e => readImg(e.target.files[0], d => { customSLogo = d; $('sLogoSel').value = 'custom'; render(); });
$('rLogoFile').onchange = e => readImg(e.target.files[0], d => { rLogo = d; render(); });
$('rLogoClear').onclick = () => { rLogo = null; $('rLogoFile').value = ''; render(); };
$('bReset').onclick = () => { ['rName','rExtra','rStreet','rCity','rZip'].forEach(k => $(k).value=''); rLogo = null; $('rLogoFile').value=''; render(); };

$('frame').onchange = e => document.body.classList.toggle('frame', e.target.checked);
loadSender(); render();
</script>
</body>
</html>
