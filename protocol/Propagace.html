<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef0f3;--pn:#fff;--tx:#1d2330;--mu:#6b7280;--bd:#d9dde3;--ac:#f15a22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--pn:#1d2128;--tx:#e6e8ec;--mu:#9aa3b0;--bd:#323843}}
:root[data-theme="dark"]{--bg:#14171c;--pn:#1d2128;--tx:#e6e8ec;--mu:#9aa3b0;--bd:#323843}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.app{display:grid;grid-template-columns:350px 1fr;gap:12px;padding:12px}
@media(max-width:860px){.app{grid-template-columns:1fr}.panel{position:static;max-height:none}.right{position:static;height:auto}.wrap{max-height:75vh}}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:14px 0 8px}h2:first-child{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px;margin-bottom:6px}label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--tx)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 7px}
input[type=color]{padding:0;width:100%;height:30px}input[type=checkbox]{width:auto}textarea{min-height:70px;resize:vertical}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg{display:grid;gap:6px}.seg button{text-align:left}.seg button.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}.seg small{display:block;color:var(--mu);font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap}#warn{color:#c2410c;font-size:12px;min-height:16px;margin-top:6px}
.right{min-width:0;display:flex;flex-direction:column;height:calc(100vh - 24px);position:sticky;top:12px}.wrap{flex:1;min-height:0;overflow:auto;padding:4px;background:var(--pn);border:1px solid var(--bd);border-radius:10px}#sw{position:relative}
.zb{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.zb input[type=range]{width:140px;padding:0}.zb b{min-width:3.2em;text-align:right}.bc{margin-bottom:4px}.bc input{width:42px;flex:none}
.sh{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:#3a3a3a;display:flex;flex-direction:column;overflow:hidden;font-family:var(--fb);padding:1.1em}
.sh *{box-sizing:border-box}.sh b{font-weight:700}
.tb{background:var(--bar);height:2.2em;flex:none}
.hd{display:flex;justify-content:space-between;align-items:center;padding:1em var(--g);flex:none}.hd img{height:2.7em;display:block}
.cl{font-family:var(--fh);font-weight:500;font-size:1.2em;line-height:1.3;text-transform:uppercase;color:#2b2b2b}
.st{height:1.5em;background:radial-gradient(#444 .5px,transparent .6px) 0 0/6px 6px,var(--strip);position:relative;flex:none}
.st::after{content:"";position:absolute;left:50%;top:100%;margin-left:-1.6em;border:1.6em solid transparent;border-top:1.2em solid var(--strip);border-bottom:0;z-index:2}
.gy{background:var(--gy);flex:none}
.hl{background:var(--hlbg);color:var(--p);font-family:var(--fh);font-weight:700;font-size:1.2em;line-height:1.4;text-transform:uppercase;padding:.8em var(--g);margin:1em 3.4em 0 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.8em;padding:.9em var(--g) 1em;font-size:.86em;line-height:1.55;text-align:justify;hyphens:auto}
.cols p{margin:0 0 .8em}
.mid{display:grid;grid-template-columns:.8fr 1.2fr;padding:.9em var(--g) .4em;position:relative;flex:none}
.circ{white-space:nowrap;width:10.6em;height:10.6em;flex:none;border-radius:50%;background:var(--ob);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--fh);font-weight:500;font-size:.8em;line-height:1.3;padding:.3em;margin:0 0 .8em 0}.circ b{font-size:1.25em;font-weight:700}
.mid h3{margin:0 0 .5em 0;font-family:var(--fh);color:var(--p);font-size:1.02em;text-transform:uppercase;font-weight:700}
.mid ul{margin:0;padding:0;list-style:none;font-size:.88em;line-height:1.36;white-space:nowrap;position:relative;z-index:2}.mid li::before{content:"• "}
.mp{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;padding-right:0}.mp img{width:118%;margin-left:-18%;display:block;position:relative;z-index:1}
.ob{background:var(--ob);color:#fff;font-family:var(--fh);font-weight:700;font-size:.92em;line-height:1.45;padding:1em 1.4em;width:80%;margin-top:.8em;z-index:1}
.bt{padding:.9em var(--g) 1.3em}
.bt .in{font-family:var(--fh);color:var(--p);text-transform:none;font-size:1.04em;line-height:1.5;grid-column:2/-1;margin:0;font-weight:500}.bt .in b{font-weight:800}
.fl{display:grid;grid-template-columns:1fr 2.4em 1fr 2.4em 1fr;gap:.8em;align-items:stretch}
.bx{background:var(--box);padding:1em 1.1em;font-size:.88em;line-height:1.45;position:relative;min-height:8.6em}.bx h4{margin:0 0 .7em;font-family:var(--fh);font-size:1em;color:#2b2b2b;font-weight:700}
.ar{align-self:center;width:0;height:0;border-left:2.2em solid var(--ob);border-top:1.7em solid transparent;border-bottom:1.7em solid transparent}
.gl{font-family:var(--fh);font-weight:800;letter-spacing:.06em;color:#444;margin-bottom:.8em;font-size:1.05em}.gl i{display:inline-block;width:.9em;height:.9em;background:var(--p);border-radius:50%;margin-right:.4em;vertical-align:-.1em}
.kn{position:absolute;right:-2.4em;bottom:-1.4em;width:6.8em;height:6.8em;border-radius:50%;background:var(--ob);color:#fff;transform:rotate(-12deg);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--fh);font-weight:800;font-size:1em;line-height:1.2;padding:.8em}
.ft{background:var(--ft);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:1em var(--g);font-size:.8em;line-height:1.5;flex:none;margin-top:auto}.ft img{height:1.7em}
.ft .c{display:flex;gap:1.6em;align-items:center}.ft .s{border-left:1px solid #fff9;padding-left:1.6em}.ft table{border-collapse:collapse}.ft td{padding:0 1em 0 0;vertical-align:top}
.card{background:var(--box);border-left:.45em solid var(--p);padding:1em 1.3em}.card h3{margin:0 0 .3em;font-family:var(--fh);color:var(--p);font-size:1.15em}.card p{margin:0;font-size:.93em;line-height:1.5}
.cds{display:grid;gap:1em;padding:1.6em 0}.org{background:var(--p);color:#fff;font-family:var(--fh);padding:1.3em 1.6em}.org h3{margin:0 0 .6em;font-size:1.1em;text-transform:uppercase}.org ul{margin:0;padding:0;list-style:none;line-height:1.6;columns:var(--oc)}.org li::before{content:"• "}
.body{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:1em;padding:1.1em var(--g)}
.body .cds{padding:0;gap:.9em}.body .ob{width:100%;margin:0;position:relative;padding:1.5em 1.6em}.body .ob .kn{right:1.4em;bottom:auto;top:50%;margin-top:-3.4em}
.card{display:flex;gap:1em;align-items:flex-start}.nm{font:800 2em/1 var(--fh);color:var(--p)}
.card ul{margin:.5em 0 0;padding:0;list-style:none;columns:2;gap:1em;font-size:.9em;line-height:1.5}.card li::before{content:"• "}
.rw{display:flex;align-items:center;justify-content:space-between;gap:1.4em}.rw img{max-width:78%;max-height:20em;object-fit:contain;margin-left:auto}
.ht3{font:700 1.1em var(--fh);color:var(--p);text-transform:uppercase;margin:0 0 .6em}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em}.fc{background:var(--ob);color:#fff;text-align:center;padding:.9em .6em}.fc b{display:block;font:800 1.8em/1.1 var(--fh)}.fc span{font-size:.85em;line-height:1.3;display:block}
.stp{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:.9em}.stp>div{border-top:.3em solid var(--p);padding-top:.5em;font-size:.88em;line-height:1.45}.stp h4{margin:0 0 .2em;font:700 1.05em var(--fh);color:var(--p)}
.ot{font-size:1em;line-height:1.55;text-align:justify;border-left:.35em solid var(--p);padding-left:1em}
.h3{position:relative;background:var(--hero);color:#fff;padding:1.4em var(--g) 1.8em;overflow:hidden;flex:none}.h3t{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5em}.h3l{height:1.9em}
.h3c{font:500 .9em/1.3 var(--fh);text-transform:uppercase;text-align:right}.h3k{font:800 2.6em/1.05 var(--fh);text-transform:uppercase}.h3o{font:700 1.3em var(--fh);margin-top:.35em;color:#2b2b2b}
.h3m{margin-top:.9em;max-width:82%;line-height:1.55;font-size:1.02em;position:relative}.h3d{position:absolute;right:-4em;bottom:-5em;width:15em;height:15em;border-radius:50%;background:#ffffff33}
.o3{display:grid;gap:.8em}.c3{background:var(--box);padding:.9em 1.1em;border-top:.3em solid var(--p)}.c3 span{font:800 1.5em/1 var(--fh);color:var(--p);display:block}.c3 h3{margin:.25em 0 .2em;font:700 1.05em var(--fh);color:#2b2b2b}.c3 p{margin:0;font-size:.88em;line-height:1.4}
.sx{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.sx>div{padding:.2em .6em;border-left:.1em solid #cfd2d5}.sx>div:first-child{border:0}.sx b{display:block;font:800 2em/1.15 var(--fh);color:var(--p)}.sx span{font-size:.85em;color:#555;line-height:1.3;display:block}
.cta{background:var(--cta);color:#fff;font:700 .92em/1.4 var(--fh);padding:1.1em 1.4em;display:flex;justify-content:space-between;align-items:center;gap:1em}.cta b{color:var(--p)}.pill{background:var(--ob);padding:.6em 1.1em;border-radius:2em;white-space:nowrap}
.t3 .ft{border-top:.35em solid var(--p)}
.fld{display:flex;flex-direction:column;margin-bottom:8px}.fln{font-size:12px;color:var(--mu);margin-bottom:2px}.tb2{display:flex;gap:2px;flex-wrap:wrap;align-items:center;border:1px solid var(--bd);border-bottom:0;border-radius:6px 6px 0 0;padding:2px;background:var(--bg)}.tb2 button{width:26px;height:26px;padding:0;border:0;background:transparent;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}.tb2 button:hover{background:var(--bd)}.tb2 button.on{background:var(--ac);color:#fff}.tb2 button.off{box-shadow:inset 0 0 0 1px var(--ac);text-decoration:line-through}.tb2 .sp{width:1px;height:16px;background:var(--bd);margin:0 3px}.fld textarea,.fld input{border-radius:0 0 6px 6px}
.ft .fb{display:flex;flex-direction:column;gap:.6em}.ft .fb img{height:2em;align-self:flex-start}.ft .c,.ft td{white-space:nowrap}

try{const s=JSON.parse(localStorage.getItem('letak-v2')||'null');if(s){Object.assign(G,s.G);for(const k in s.T)Object.assign(T[k],s.T[k]);th=s.th||1;if(s.BC)for(const k in s.BC)Object.assign(BC[k],s.BC[k]);if(s.TF)for(const k in s.TF)TF[k]=s.TF[k]}}catch(x){}
const sv=()=>{try{localStorage.setItem('letak-v2',JSON.stringify({G,T,th,BC,TF}))}catch(x){}};
const IC={left:'M1 3h12M1 6h8M1 9h12M1 12h8',center:'M1 3h12M3 6h8M1 9h12M3 12h8',right:'M1 3h12M5 6h8M1 9h12M5 12h8',justify:'M1 3h12M1 6h12M1 9h12M1 12h12'},ALT={left:'Vlevo',center:'Na střed',right:'Vpravo',justify:'Do bloku'};
const tbH=k=>{const o=TF[th][k]||{};
 const c=(f,t,ttl)=>{const x=o[f],cls=f==='c'?(x==='u'?'on':x==='n'?'off':''):(x==='1'?'on':x==='0'?'off':'');return `<button type="button" data-f="${f}" class="${cls}" title="${ttl} (klik: ano / ne / výchozí)">${t}</button>`};
 const al=v=>`<button type="button" data-f="a" data-v="${v}" class="${o.a===v?'on':''}" title="Zarovnání: ${ALT[v]}"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="${IC[v]}"/></svg></button>`;
 return `<div class="tb2" data-k="${k}">${c('b','<b>B</b>','Tučně')}${c('i','<i>I</i>','Kurzíva')}${c('u','<u>U</u>','Podtržení')}${c('c','Aa','Velikost písmen (VERZÁLKY / normální)')}<span class="sp"></span>${['left','center','right','justify'].map(al).join('')}</div>`};
function tfClick(tb,b){const k=tb.dataset.k,o=TF[th][k]||(TF[th][k]={}),f=b.dataset.f;
 if(f==='a'){if(o.a===b.dataset.v)delete o.a;else o.a=b.dataset.v}
 else{const c=o[f];o[f]=f==='c'?(!c?'u':c==='u'?'n':''):(!c?'1':c==='1'?'0':'');if(!o[f])delete o[f]}
 tb.outerHTML=tbH(k);render()}
function forms(){
 $('#th').innerHTML=TH.map((t,i)=>`<button data-th="${i+1}" class="${th==i+1?'on':''}">${t[0]}<small>${t[1]}</small></button>`).join('');
 $('#tf').innerHTML=FL[th].map(k=>`<div class="fld"><span class="fln">${LB[k]}</span>${tbH(k)}${TA.has(k)?`<textarea data-t="${k}">${e(T[th][k])}</textarea>`:`<input data-t="${k}" value="${e(T[th][k])}">`}</div>`).join('');
 $('#gf').innerHTML=GF.map(([k,l])=>`<label>${l}<input data-g="${k}" value="${e(G[k])}"></label>`).join('');
 $('#bcf').innerHTML=BK[th].map(([k,l])=>`<label class="ck bc"><input type="color" data-bc="${k}" value="${col(k)}">${l}</label>`).join('');document.querySelector('[data-g=pc]').value=G.pc;$('[data-g=fh]').value=G.fh;$('[data-g=fb]').value=G.fb;document.querySelector('[data-g=map]').checked=G.map;
 $('#fmt').value=G.fmt;$('#ori').value=G.ori;$('#fmt').disabled=th!=2;
}
const X=k=>{const f=TF[th][k]||{};let r='';if(f.a)r+=`text-align:${f.a};`;if(f.b)r+=`font-weight:${f.b==='1'?700:400};`;if(f.i)r+=`font-style:${f.i==='1'?'italic':'normal'};`;if(f.u)r+=`text-decoration:${f.u==='1'?'underline':'none'};`;if(f.c)r+=`text-transform:${f.c==='u'?'uppercase':'none'};`;return r};
const hd=t=>`<div class="tb"></div><div class="hd"><img src="${LOGO}"><div class="cl" style="${X('claim')}">${md(t.claim)}</div></div><div class="st"></div>`;
const ft=()=>`<div class="ft"><div class="fb"><img src="${LOGOW}"><div><b>${e(G.firma)}</b><br>${e(G.addr)}</div></div><div class="c"><div>IČ: ${e(G.ic)}<br>DIČ: ${e(G.dic)}</div><div class="s"><table><tr><td>tel.:</td><td>${md(G.tel)}</td></tr><tr><td>e-mail:</td><td>${e(G.email)}</td></tr><tr><td>web:</td><td>${md(G.web)}</td></tr></table></div></div></div>`;
const circ=t=>`<div class="circ"><div style="${X('circ')}">${md(t.circ)}</div></div>`;
function html(land){
 const t=T[th];
 if(th==1){const f=ul(t.feat),ex=ul(t.exp),ly=ul(t.layers);
  return hd(t)+`<div class="gy"><div class="hl" style="${X('hl')}">${e(t.hl)}</div><div class="cols"><div style="${X('c1')}">${t.c1.split('\n\n').map(p=>`<p>${md(p)}</p>`).join('')}</div><div style="${X('c2')}"><p>${md(t.c2)}</p></div></div></div>`+
  `<div class="mid"><div>${circ(t)}<h3 style="${X('ht')}">${e(t.ht)}</h3><ul style="${X('help')}">${ul(t.help).map(x=>`<li>${e(x)}</li>`).join('')}</ul></div><div class="mp">${G.map?`<img src="${MAP}">`:'<span></span>'}<div class="ob" style="${X('ob')}">${md(t.ob)}</div></div></div>`+
  `<div class="gy bt"><div class="fl"><div class="in" style="${X('gin')}">${md(t.gin)}</div><div class="bx"><h4 style="${X('lt')}">${e(t.lt)}</h4><div style="${X('layers')}">${ly.map(e).join('<br>')}</div></div><div class="ar"></div><div class="bx"><div class="gl"><i></i>GISADMIN</div><div style="${X('feat')}">${f.map(e).join('<br>')}</div></div><div class="ar"></div><div class="bx"><h4 style="${X('et')}">${e(t.et)}</h4><div style="${X('exp')}">${ex.map(e).join('<br>')}</div><div class="kn" style="${X('kn')}">${e(t.kn)}</div></div></div></div>`+ft()}
 const P=x=>String(x).split('\n').filter(y=>y.trim()).map(y=>y.split('|').map(z=>z.trim()));
 const fx=()=>`<div class="fx" style="${X('facts')}">${P(t.facts).map(([a,b])=>`<div class="fc"><b>${e(a)}</b><span>${e(b)}</span></div>`).join('')}</div>`;
 if(th==2){const L=P(t.sv),S=P(t.steps);
  return hd(t)+`<div class="gy"><div class="hl" style="${X('hl')}">${e(t.hl)}</div><div class="cols" style="grid-template-columns:1fr;font-size:.98em;${X('lead')}">${md(t.lead)}</div></div>`+
  `<div class="body"><div class="cds" style="grid-template-columns:${land?`repeat(${L.length},1fr)`:'1fr'}">${L.map(([a,b,c],i)=>`<div class="card"><div class="nm">0${i+1}</div><div style="${X('sv')}"><h3>${e(a)}</h3><p>${e(b)}</p>${c?`<ul>${c.split(';').map(x=>`<li>${e(x.trim())}</li>`).join('')}</ul>`:''}</div></div>`).join('')}</div>`+
  `${fx()}${land?'':`<div><div class="ht3" style="${X('st')}">${e(t.st)}</div><div class="stp" style="--n:${S.length};${X('steps')}">${S.map(([x,y],i)=>`<div><h4>${i+1}. ${e(x)}</h4>${e(y)}</div>`).join('')}</div></div>`}<div class="ob" style="${X('ob')}">${md(t.ob)}</div></div>`+ft()}
 const L=P(t.list3);
 return `<div class="h3"><div class="h3t"><img src="${LOGOW}" class="h3l"><div class="h3c" style="${X('claim')}">${md(t.claim)}</div></div><div class="h3k" style="${X('hl')}">${e(t.hl)}</div>${t.obec?`<div class="h3o" style="${X('obec')}">${e(t.obec)}</div>`:''}<div class="h3m" style="${X('msg')}">${md(t.msg)}</div><i class="h3d"></i></div>`+
  `<div class="body"><div><div class="ht3" style="${X('ht3')}">${e(t.ht3)}</div><div class="o3" style="grid-template-columns:${land?'repeat(4,1fr)':'1fr 1fr'}">${L.map(([a,b],i)=>`<div class="c3" style="${X('list3')}"><span>0${i+1}</span><h3>${e(a)}</h3>${b?`<p>${e(b)}</p>`:''}</div>`).join('')}</div></div>`+
  `<div class="sx" style="${X('facts')}">${P(t.facts).map(([a,b])=>`<div><b>${e(a)}</b><span>${e(b)}</span></div>`).join('')}</div><div class="ot" style="${X('outro')}">${e(t.outro)}</div><div class="cta"><div style="${X('ob')}">${md(t.ob)}</div><div class="pill" style="${X('kn')}">${e(t.kn)}</div></div></div>`+ft();
}
function render(){
 const land=G.ori==='l',a4=G.fmt==='A4';let w=a4?794:559,h=a4?1123:794;if(land)[w,h]=[h,w];
 const u=Math.sqrt(Math.min(w,h)/794),s=$('#sheet'),sw=$('#sw');
 s.style.cssText=`width:${w}px;height:${h}px;font-size:${(th==1?11.7:th==2&&!a4?11.6:th==2?12.7:th==3?(land?(a4?13:12.2):a4?14:14.4):12.6)*u}px;--g:2em;--p:${G.pc};--fh:${FS[G.fh]||FS['Montserrat']};--fb:${FS[G.fb]||FS['Open Sans']};${BK[th].map(([k])=>`--${k}:${col(k)}`).join(';')}`;s.className='sh t'+th;s.innerHTML=html(land);
 const fit=Math.min(1,Math.max(260,$('.wrap').clientWidth-10)/w),k=Z==='fit'?fit:Z/100;K=k;$('#zr').value=Math.round(k*100);$('#zl').textContent=Math.round(k*100)+' %';document.querySelectorAll('[data-bc]').forEach(i=>{if(i!==document.activeElement)i.value=col(i.dataset.bc)});
 s.style.transform=`scale(${k})`;sw.style.width=w*k+'px';sw.style.height=h*k+'px';
 $('#warn').textContent=s.scrollHeight>h+2?'⚠ Obsah se nevejde na stránku – zkraťte texty nebo zvolte větší formát.':'';
 $('#pg').textContent=`@page{size:${G.fmt} ${land?'landscape':'portrait'};margin:0}`;sv();
}
const dl=(u,n)=>{const a=document.createElement('a');a.href=u;a.download=n;a.click()};
async function exp(kind){
 if(kind==='print'){window.print();return}
 const s=$('#sheet'),tr=s.style.transform;s.style.transform='none';
 try{await document.fonts.ready;const cv=await html2canvas(s,{scale:3,useCORS:true,backgroundColor:'#ffffff'});
  if(kind==='png')cv.toBlob(b=>dl(URL.createObjectURL(b),'letak-atomicon.png'));
  else{const d=new jspdf.jsPDF({unit:'mm',format:G.fmt.toLowerCase(),orientation:G.ori}),pw=d.internal.pageSize.getWidth(),ph=d.internal.pageSize.getHeight();
   d.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,ph);d.save('letak-atomicon.pdf')}
 }catch(x){alert('Export selhal: '+x.message)}finally{s.style.transform=tr}
}
document.addEventListener('input',x=>{const t=x.target;if(t.dataset.t)T[th][t.dataset.t]=t.value;else if(t.dataset.g)G[t.dataset.g]=t.type==='checkbox'?t.checked:t.value;else if(t.id==='fmt')G.fmt=t.value;else if(t.id==='ori')G.ori=t.value;else if(t.dataset.bc)BC[th][t.dataset.bc]=t.value;else if(t.id==='zr')Z=+t.value;else return;render()});
document.addEventListener('click',x=>{const b=x.target.closest('button');if(!b)return;
 const tb=b.closest('.tb2');if(tb){tfClick(tb,b);return}
 if(b.dataset.th){th=+b.dataset.th;if(th==1)G.fmt='A4';if(th==3)G.fmt='A5';forms();render()}if(b.dataset.x)exp(b.dataset.x);if(b.id==='bcr'){BC[th]={};forms();render()}if(b.dataset.z){const z=b.dataset.z;Z=z==='fit'?'fit':z==='100'?100:Math.max(25,Math.min(200,Math.round(K*100)+(z==='+'?10:-10)));render()}});
window.addEventListener('resize',render);
if(th==1)G.fmt='A4';if(th==3)G.fmt='A5';forms();render();
if(document.fonts)document.fonts.ready.then(render);
</script></body></html>
