      const sun = [-.55, -.35];

  // ---------- objekty ----------
  // hranol: viditelné stěny + střecha; cols = [světlá, tmavá, střecha]

      if (opt.windows) opt.windows(w);

    path(p, z1); cx.closePath(); cx.fillStyle = cols[2]; cx.fill();

  function building(b) {
    const our = !!b.our, pal = COL.walls[b.w % COL.walls.length];
    const cols = our ? [COL.ourL, COL.ourR, COL.ourRoof] : [pal[0], pal[1], COL.roof];
    const z0 = b.roof ? b.h - .6 : 0;
    prism(b.p, z0, b.h, cols, {

  }

  // valbová (čtyřboká) střecha jako komolý jehlan: okap = půdorys, hřeben = zúžený půdorys

  // ---------- ručně stavěné dominanty (podle fotografií, rozměry z literatury) ----------
  function landmark(o) {

    const gold = night ? '#c9a24a' : '#e2b13c';
    if (o.t === 'tower') {

  function tree(t) {

  }
  function shadeHex(h, f) { const n = parseInt(h.slice(1), 16), c = v => Math.max(0, Math.min(255, Math.round(v + 255 * f))); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(c).map(v => v.toString(16).padStart(2, '0')).join(''); }

  }

  // ---------- maskot J.E.N.D.A. (pixel-art z rozcestníku, v obřím měřítku) ----------
  const JP = { H: '#ea521f', h: '#b93f15', w: '#ff9a70', S: '#f6c9a3', s: '#e2a77f', R: '#6b4226', E: '#1f2937', W: '#ffffff', M: '#b4532a', V: '#f97316', v: '#d65f0d', Y: '#fde047', y: '#e5c321', B: '#475569', b: '#334155', L: '#1f2937', l: '#cbd5e1', P: '#1e3a8a', p: '#172a63', K: '#292524', k: '#57534e', r: '#dc2626', G: '#f1f5f9', g: '#64748b' };

  const ARM_OUT = [[16, 16, 'B'], [17, 16, 'b'], [17, 15, 'B'], [18, 15, 'b'], [17, 14, 'B'], [18, 14, 'b'], [18, 13, 'B'], [19, 13, 'b'], [18, 12, 'B'], [19, 12, 'b'], [18, 11, 'S'], [19, 11, 's'], [18, 10, 'S'], [19, 10, 's'], [18, 9, 'S'], [19, 9, 'S'], [17, 10, 'S']];
  function jenda(t) {
    const base = T(D.jenda[0], D.jenda[1], 0), px = Math.max(1.4, .34 * K), w = 20 * px, hgt = 28 * px;
    const ox = base[0] - w / 2, oy = base[1] - hgt;
    const cells = [];
    JB.forEach((row, y) => row.split('').forEach((ch, x) => { if (ch !== '.') cells.push([x, y, ch]); }));

  }

  // ---------- pohyb (auta a chodci po trasách z mapy) ----------
  function routeInfo(line) { const seg = []; let L = 0; for (let i = 1; i < line.length; i++) { const l = Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]); seg.push(l); L += l; } return { line, seg, L }; }
  function at(r, s) { // pozice a směr ve vzdálenosti s (tam a zpět)

  const CARS = D.cars.map((l, i) => ({ r: routeInfo(l), s: i * 37, v: 7 + (i % 3) * 1.5, c: i }));
  const WALK = D.walk.map((l, i) => ({ r: routeInfo(l), s: i * 13, v: 1.1 + (i % 4) * .12, c: i }));

  // ---------- vykreslení snímku ----------
  let t0 = performance.now(), tNow = 0;
  function frame() {

    drawGround();
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
    cx.drawImage(ground, 0, 0);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.lineJoin = 'round'; cx.lineCap = 'round';
    const items = [];
    D.b.forEach(b => { const c = centroid(b.p); items.push([proj(c[0], c[1], 0)[2], 0, b]); });
    D.t.forEach(t => items.push([proj(t[0], t[1], 0)[2], 1, t]));
    D.lamp.forEach(p => items.push([proj(p[0], p[1], 0)[2], 2, p]));
    D.pk.forEach(p => items.push([proj(p[0], p[1], 0)[2], 3, p]));
    const inside = (x, y, m) => Math.abs(x) < D.half - m && Math.abs(y) < D.half - m; // mimo podstavec nic nekreslit
    CARS.forEach(c => { const p = at(c.r, c.s); const x = p[0] + p[3] * 1.7, y = p[1] - p[2] * 1.7; if (inside(x, y, 2.5)) items.push([proj(x, y, 0)[2], 4, [x, y, Math.atan2(p[3], p[2]), c.c]]); });
    WALK.forEach(w => { const p = at(w.r, w.s); if (inside(p[0], p[1], 1)) items.push([proj(p[0], p[1], 0)[2], 5, [p[0], p[1], w.c, w.s * 4]]); });
    (D.lm || []).forEach(o => items.push([proj(o.x, o.y, 0)[2], 7, o]));
    if (D.jenda) items.push([proj(D.jenda[0], D.jenda[1], 0)[2] + .5, 6, null]);
    items.sort((a, b) => a[0] - b[0]).forEach(it => {
      const o = it[2];
      switch (it[1]) {
        case 0: building(o); break;
        case 1: tree(o); break;
        case 2: lamp(o); break;
        case 3: car(o[0], o[1], o[2], o[3]); break;
        case 4: car(o[0], o[1], o[2], o[3]); break;
        case 5: person(o[0], o[1], o[2], o[3]); break;
        case 6: jenda(tNow); break;
        case 7: landmark(o); break;
      }
    });
    pin();
  }

  function pin() {
    const our = D.b.find(b => b.our); if (!our && !D.pinAt) return;
    const c = D.pinAt || centroid(our.p), s = T(c[0], c[1], D.pinAt ? D.pinAt[2] : our.h + 6), r = Math.max(7, 9 * Math.sqrt(zoom));
    cx.beginPath(); cx.moveTo(s[0], s[1]); cx.lineTo(s[0] - r * .8, s[1] - r * 1.5); cx.arc(s[0], s[1] - r * 2, r, Math.PI * .8, Math.PI * .2, false); cx.closePath();
    cx.fillStyle = '#ea521f'; cx.fill(); cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke();
    cx.beginPath(); cx.arc(s[0], s[1] - r * 2, r * .38, 0, Math.PI * 2); cx.fillStyle = '#fff'; cx.fill();
    cx.font = '700 12px Segoe UI, system-ui, sans-serif'; cx.textAlign = 'center';
    const label = D.label, tw = cx.measureText(label).width, y = s[1] - r * 3.2 - 22;
    cx.beginPath(); cx.roundRect ? cx.roundRect(s[0] - tw / 2 - 8, y, tw + 16, 20, 5) : cx.rect(s[0] - tw / 2 - 8, y, tw + 16, 20);
    cx.fillStyle = 'rgba(255,252,244,.96)'; cx.fill(); cx.strokeStyle = '#ea521f'; cx.lineWidth = 1.2; cx.stroke();
    cx.fillStyle = '#2b2622'; cx.fillText(label, s[0], y + 14);
  }

  // ---------- smyčka: běží jen když se hraje a stránka je vidět (~30 fps); jinak jen na vyžádání ----------
  let raf = 0, last = 0, dirty = true;
  function loop(now) {
    raf = 0;
    const dt = Math.min(.1, (now - (last || now)) / 1000);
    if (playing && !document.hidden) {
      if (now - last >= 33) {
        CARS.forEach(c => c.s += c.v * dt); WALK.forEach(w => w.s += w.v * dt);
        tNow = now - t0; last = now; frame(); dirty = false;
      }
      raf = requestAnimationFrame(loop);
    } else if (dirty) { last = now; frame(); dirty = false; }
  }
  function req() { dirty = true; if (!raf) raf = requestAnimationFrame(loop); }
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; groundKey = ''; req(); }

  // ---------- ovládání ----------
  const setZoom = (f, ox, oy) => { const nz = Math.max(.6, Math.min(6, zoom * f)), r = nz / zoom; ox = ox ?? W / 2; oy = oy ?? H / 2; panX = (panX + W / 2 - ox) * r - W / 2 + ox; panY = (panY + H / 2 + 30 - oy) * r - H / 2 - 30 + oy; zoom = nz; req(); };
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', req);
  cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY, panX, panY]; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', e => { if (!drag) return; panX = drag[2] + e.clientX - drag[0]; panY = drag[3] + e.clientY - drag[1]; req(); });
  cv.addEventListener('pointerup', () => { drag = null; cv.classList.remove('drag'); });
  const turn = d => { rot = (rot + d + 8) % 8; req(); };
  const $ = id => document.getElementById(id);
  $('rl').onclick = () => turn(-1); $('rr').onclick = () => turn(1);
  $('zi').onclick = () => setZoom(1.25); $('zo').onclick = () => setZoom(1 / 1.25);
  $('rs').onclick = () => { rot = D.rot ?? 1; zoom = 1; panX = panY = 0; req(); };
  const setNight = v => { night = v; COL = v ? NIGHT : DAY; document.body.classList.toggle('night', v); $('night').textContent = v ? '☀' : '☾'; groundKey = ''; req(); };
  $('night').onclick = () => setNight(!night);
  const setPlay = v => { playing = v; $('play').textContent = v ? '⏸' : '▶'; last = 0; req(); };
  $('play').onclick = () => setPlay(!playing);
  setPlay(playing);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') turn(-1); else if (e.key === 'ArrowRight') turn(1);
    else if (e.key === '+' || e.key === '=') setZoom(1.25); else if (e.key === '-') setZoom(1 / 1.25);
    else if (e.key === 'n' || e.key === 'N') setNight(!night);
    else if (e.key === ' ') { e.preventDefault(); setPlay(!playing); }
    else if (e.key === 'Escape' && embedded) parent.postMessage({ type: 'jenda-easter-close' }, '*');
  });
  resize();
})();
</script>
</body>
