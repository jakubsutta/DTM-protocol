<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Logo J.E.N.D.A. – rozcestník: sloup s cedulemi do různých směrů (= rozcestník k nástrojům).
       Oranžová = barva helmy maskota, modrá = firemní (Atomicon). -->
  <rect width="32" height="32" rx="7.5" fill="#1a1a2e"/>
  <!-- sloup -->
  <rect x="14.6" y="5" width="2.8" height="22.5" rx="1.2" fill="#cbd5e1"/>
  <!-- cedule doprava (oranžová) -->
  <path d="M8 7.5h13.2l3.3 3.2-3.3 3.2H8a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z" fill="#ea521f"/>
  <!-- cedule doleva (modrá) -->
  <path d="M24 16.5H10.8l-3.3 3.2 3.3 3.2H24a1 1 0 0 0 1-1v-4.4a1 1 0 0 0-1-1z" fill="#4483fc"/>
  <!-- patka -->
  <rect x="11" y="27" width="10" height="1.8" rx=".9" fill="#64748b"/>
</svg>
